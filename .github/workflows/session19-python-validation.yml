name: Session 19 Python validation

on:
  push:
    branches:
      - session-19-closure
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Full Python suite
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install pytest
          PYTHONPATH=. pytest -q
          count=$(PYTHONPATH=. pytest --collect-only -q -o addopts='' | grep -c '::')
          echo "PYTEST_COLLECTED=$count"
          test "$count" -eq 122
      - name: Deterministic Session 16 diagnostics
        shell: bash
        run: |
          set -euxo pipefail
          PYTHONPATH=. python scripts/tabulate_binary_partition_asymptotics.py             --levels 6,8,10,12,14             --phases 9/16,3/4,1             --output /tmp/session16.csv
          diff --strip-trailing-cr /tmp/session16.csv data/session16_binary_partition_diagnostics.csv
          sed 's/\r$//' /tmp/session16.csv | sha256sum
      - name: Deterministic Session 17 diagnostics
        shell: bash
        run: |
          set -euxo pipefail
          PYTHONPATH=. python scripts/tabulate_product_geometric_asymptotics.py             --levels 4,6,8,10,12             --phases 9/16,3/4,1             --exact-through-level 8             --output /tmp/session17-a.csv
          PYTHONPATH=. python scripts/tabulate_product_geometric_asymptotics.py             --levels 4,6,8,10,12             --phases 9/16,3/4,1             --exact-through-level 8             --output /tmp/session17-b.csv
          cmp /tmp/session17-a.csv /tmp/session17-b.csv
          sha256sum /tmp/session17-a.csv
      - name: Deterministic Session 18 diagnostics
        shell: bash
        run: |
          set -euxo pipefail
          PYTHONPATH=. python scripts/tabulate_global_conditioning.py             --levels 256,1024,4096,16384             --offsets=-2,-1,-0.5,0.5,1,2             --output /tmp/session18.csv
          diff --strip-trailing-cr /tmp/session18.csv data/session18_global_balance.csv
          sed 's/\r$//' /tmp/session18.csv | sha256sum
