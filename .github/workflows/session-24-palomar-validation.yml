name: Session 24 Palomar validation

on:
  push:
    branches:
      - session-24-palomar-packaging
  workflow_dispatch:

concurrency:
  group: session-24-palomar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check submitted Lean source module headers
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          bad = []
          for p in Path(".").rglob("*.lean"):
              parts = set(p.parts)
              if ".git" in parts or ".lake" in parts:
                  continue
              if p.name == "lakefile.lean":
                  continue
              text = p.read_text()
              lines = text.splitlines()
              i = 0
              in_block = False
              while i < len(lines):
                  s = lines[i].lstrip()
                  if in_block:
                      if "-/" in s:
                          in_block = False
                          s = s.split("-/", 1)[1].lstrip()
                          if not s:
                              i += 1
                              continue
                      else:
                          i += 1
                          continue
                  if not s or s.startswith("--"):
                      i += 1
                      continue
                  if s.startswith("/-"):
                      if "-/" not in s[2:]:
                          in_block = True
                          i += 1
                          continue
                      s = s.split("-/", 1)[1].lstrip()
                      if not s:
                          i += 1
                          continue
                  if s != "module":
                      bad.append((str(p), i + 1, lines[i]))
                  break
              else:
                  bad.append((str(p), 0, "empty file"))
          if bad:
              for item in bad:
                  print("MODULE_HEADER_ERROR", item)
              raise SystemExit(1)
          print("All regular submitted Lean sources begin with module.")
          PY

      - name: Install exact Lean toolchain
        shell: bash
        run: |
          set -euxo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build pinned TreeStack dependency and full ProbStack package
        shell: bash
        run: |
          set -euxo pipefail
          lean --version
          lake --version
          lake update
          lake build @treestack/+TreeStack.RootScore
          lake build
          lake build Challenge Solution
          if grep -R -n -E '(^|[^A-Za-z])(sorry|axiom)([^A-Za-z]|$)' --include='*.lean' ProbStack ProbStack.lean; then
            echo "Found forbidden sorry/axiom in ProbStack Lean sources"
            exit 1
          fi

      - name: Run Python regression suite
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check pytest
          PYTHONPATH=. pytest -q

      - name: Validate Palomar metadata locally
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL \
            https://raw.githubusercontent.com/PalomarRegistry/PalomarTemplate/2891de4c48955af824969a263d31b25e7a9a1406/scripts/validate-formalization.rb \
            -o /tmp/validate-formalization.rb
          ruby /tmp/validate-formalization.rb formalization.yaml

      - name: Run local Comparator with bundled independent kernels
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq meson ninja-build libcap-dev pkg-config >/dev/null
          curl -fsSL \
            https://raw.githubusercontent.com/PalomarRegistry/PalomarSubmission/65f0154ed776cd26c224254aa57b379137f28b0d/scripts/install_bwrap.sh \
            -o /tmp/install-palomar-bwrap.sh
          chmod +x /tmp/install-palomar-bwrap.sh
          PALOMAR_BWRAP="$(/tmp/install-palomar-bwrap.sh "$RUNNER_TEMP/palomar-bwrap-bin")"
          prefix="$(lean --print-prefix)"
          for tool in lake leanexport leanchecker nanoda_bin con-ron; do
            test -x "$prefix/bin/$tool"
          done
          cfg="$(mktemp)"
          python3 - "$cfg" "$prefix" <<'PY'
          import json, pathlib, sys
          destination, prefix = sys.argv[1:]
          config = json.loads(pathlib.Path("comparator.json").read_text())
          if "external_kernels" in config:
              raise SystemExit("external_kernels is not a submitter field")
          config.pop("enable_nanoda", None)
          config["external_kernels"] = {
              "nanoda": [f"{prefix}/bin/nanoda_bin"],
              "con-ron": [f"{prefix}/bin/con-ron"],
          }
          pathlib.Path(destination).write_text(json.dumps(config, indent=2) + "\n")
          PY
          lake exe cache get
          COMPARATOR_BWRAP="$PALOMAR_BWRAP" lake comparator --config "$cfg"

  palomar-full-preflight:
    needs: project-validation
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@65f0154ed776cd26c224254aa57b379137f28b0d
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: 65f0154ed776cd26c224254aa57b379137f28b0d
      request_id: session24full
      mode: full
      options: '{"comparator_config_path":"comparator.json","authorization_relationship":"I am a responsible author or maintainer"}'
