name: Session 14 Python validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  exact-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run exact finite probability tests
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m pip install -e '.[test]'
          python3 -m pytest tests/test_finite_probability.py -q
