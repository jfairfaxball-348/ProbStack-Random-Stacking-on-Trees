name: Research validation

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Full pytest
        run: pytest
      - name: Exhaustive direct-vs-structural validator
        run: python scripts/validate_small.py --max-order 5 --max-total 5
      - name: Path-specific exhaustive tests
        run: pytest tests/test_path_score.py
      - name: Product-chain and spatial tests
        run: pytest tests/test_product_chain.py tests/test_product_spatial.py
      - name: Session 4 exact missed-front catalogue
        run: |
          python scripts/classify_missed_front_failures.py --max-order 10 --max-total 8 --output /tmp/missed_front_small_exact.csv
          tail -n 12 /tmp/missed_front_small_exact.csv
      - name: Session 4 rigorous spatial table
        run: |
          python scripts/tabulate_spatial_front_certificate.py --levels 4,5,6,8,10,12,16 --output /tmp/spatial_front_rigorous_bounds.csv
          cat /tmp/spatial_front_rigorous_bounds.csv
      - name: Session 4 seed-to-front diagnostic
        run: |
          python scripts/analyze_seed_to_front.py --means 16,32,64,128 --trials 20000 --seed-base 2026092700 --output /tmp/seed_to_front_mc.csv
          cat /tmp/seed_to_front_mc.csv
      - name: Validate experiment ledger
        run: python -c "import json, pathlib; [json.loads(x) for x in pathlib.Path('data/experiment_log.jsonl').read_text().splitlines() if x.strip()]; print('experiment_log.jsonl: valid')"
