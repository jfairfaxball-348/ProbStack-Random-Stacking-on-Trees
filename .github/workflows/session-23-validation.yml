name: Session 23 validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Full Python suite
        run: PYTHONPATH=. pytest -q
      - name: Exhaustive P6 finite check
        shell: bash
        run: |
          PYTHONPATH=. python - <<'PY'
          from prob_stack.configurations import weak_compositions
          from prob_stack.path_score import (
              left_incoming_messages,
              right_incoming_messages,
              path_structurally_stackable,
          )
          from prob_stack.tree_score import EMPTY

          checked = 0
          for n in range(2, 8):
              for total in range(1, 13):
                  for c in weak_compositions(total, n):
                      if path_structurally_stackable(c):
                          continue
                      messages = tuple(
                          m for m in
                          (left_incoming_messages(c)[1:] +
                           right_incoming_messages(c)[:-1])
                          if m is not EMPTY
                      )
                      for h in range(1, 8):
                          if total > (n - 1) * (h // 2 + 1):
                              assert any(m <= -h for m in messages), (n, total, h, c, messages)
                      checked += 1

          fixed_checked = 0
          for n in range(2, 7):
              for mu in range(1, 4):
                  total = n * mu
                  threshold = -(2 * mu - 1)
                  for c in weak_compositions(total, n):
                      if path_structurally_stackable(c):
                          continue
                      messages = tuple(
                          m for m in
                          (left_incoming_messages(c)[1:] +
                           right_incoming_messages(c)[:-1])
                          if m is not EMPTY
                      )
                      assert any(m <= threshold for m in messages), (n, mu, c, messages)
                      fixed_checked += 1

          print(f"general_nonstackable_cases={checked}")
          print(f"fixed_total_nonstackable_cases={fixed_checked}")
          PY
